{% extends "base.html" %}

{% block title %}Sign In - PocketSmart AI{% endblock %}

{% block content %}
<div class="container-narrow" style="max-width: 440px; margin: 3rem auto;">
    <div class="form-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--primary-900);">Welcome Back</h1>
            <p style="color: var(--neutral-600); font-size: 0.95rem; margin-top: 0.25rem;">
                Your budget plans are waiting for you.
            </p>
        </div>

        {% if error %}
            <div class="alert alert-error">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form action="/login" method="POST" autocomplete="off">
            <div class="form-group">
                <label for="username" class="form-label">Email or Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="alex@example.com or alex24" required autofocus>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
                Sign In
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--neutral-600);">
            Don't have an account? <a href="/register" style="font-weight: 600;">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
