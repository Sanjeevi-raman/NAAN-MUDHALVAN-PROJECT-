{% extends "base.html" %}

{% block title %}Register - PocketSmart AI{% endblock %}

{% block content %}
<div class="container-narrow" style="max-width: 480px; margin: 2.5rem auto;">
    <div class="form-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--primary-900);">Create an Account</h1>
            <p style="color: var(--neutral-600); font-size: 0.95rem; margin-top: 0.25rem;">
                Smart spending starts with one account. Join PocketSmart AI today.
            </p>
        </div>

        {% if error %}
            <div class="alert alert-error">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form action="/register" method="POST" autocomplete="off">
            <div class="form-group">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-input" placeholder="e.g. Alex Johnson">
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Username <span style="color:var(--accent-rose);">*</span></label>
                <input type="text" id="username" name="username" class="form-input" placeholder="e.g. alex24" minlength="3" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address <span style="color:var(--accent-rose);">*</span></label>
                <input type="email" id="email" name="email" class="form-input" placeholder="alex@example.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password <span style="color:var(--accent-rose);">*</span></label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Min. 6 characters" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
                Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--neutral-600);">
            Already have an account? <a href="/login" style="font-weight: 600;">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
